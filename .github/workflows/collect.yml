name: collect-prices

# 观察期策略：
# - 每 6 小时：发现新场次 + 采价（攒历史）
# - 暂不跑 Decision 分析
on:
  schedule:
    # UTC 00/06/12/18 → 北京时间 08/14/20/02，一天 4 次
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:
    inputs:
      dryrun:
        description: "仅打印不写表(1=dry-run)"
        required: false
        default: "0"
      skip_discover:
        description: "跳过发现只采价(1=skip)"
        required: false
        default: "0"

concurrency:
  group: collect-prices
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Discover shows into Watchlist
        if: ${{ github.event.inputs.skip_discover != '1' }}
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          CONCERTOWL_DRYRUN: ${{ github.event.inputs.dryrun }}
        # discover 已同时写一版快照；后续 collect 再刷新一次已有场次
        run: python -m concertowl.discover

      - name: Collect prices
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          CONCERTOWL_DRYRUN: ${{ github.event.inputs.dryrun }}
        run: python -m concertowl.run_collect
