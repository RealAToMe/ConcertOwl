name: collect-prices

on:
  push:
    branches: [main]
    paths:
      - "concertowl/**"
      - "config/**"
      - "requirements.txt"
      - ".github/workflows/collect.yml"
  schedule:
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:
    inputs:
      dryrun:
        description: "仅打印，不提交 data 分支（1=dry-run）"
        required: false
        default: "0"
      skip_discover:
        description: "跳过发现，只采价（1=skip）"
        required: false
        default: "0"

concurrency:
  group: collect-prices
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout application
        uses: actions/checkout@v7
        with:
          path: app
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install deps
        run: pip install -r app/requirements.txt

      - name: Checkout data branch
        shell: bash
        run: |
          git -C app fetch origin data
          git -C app worktree add "${GITHUB_WORKSPACE}/data-branch" origin/data

      - name: Discover shows into Watchlist
        if: ${{ github.event.inputs.skip_discover != '1' }}
        working-directory: app
        env:
          CONCERTOWL_DATA_DIR: ${{ github.workspace }}/data-branch
          CONCERTOWL_DRYRUN: ${{ github.event.inputs.dryrun }}
          CONCERTOWL_DISCOVER_SNAPSHOT: "0"
        run: python -m concertowl.discover

      - name: Collect prices
        working-directory: app
        env:
          CONCERTOWL_DATA_DIR: ${{ github.workspace }}/data-branch
          CONCERTOWL_RUN_ID: ${{ github.run_id }}
          CONCERTOWL_DRYRUN: ${{ github.event.inputs.dryrun }}
        run: python -m concertowl.run_collect

      - name: Build static dashboard
        if: ${{ github.event.inputs.dryrun != '1' }}
        working-directory: app
        run: >-
          python -m concertowl.view_trends
          --data-dir "${{ github.workspace }}/data-branch"
          --output-dir "${{ github.workspace }}/data-branch/site"
          --no-browser

      - name: Commit repository data
        if: ${{ github.event.inputs.dryrun != '1' }}
        shell: bash
        working-directory: data-branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meta prices runs site
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "collect: run ${{ github.run_id }}"
          git push origin HEAD:data

      - name: Configure Pages
        if: ${{ github.event.inputs.dryrun != '1' }}
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        if: ${{ github.event.inputs.dryrun != '1' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: data-branch/site

      - name: Deploy Pages
        if: ${{ github.event.inputs.dryrun != '1' }}
        id: deployment
        uses: actions/deploy-pages@v4
